field: "deductible"

also_appears_as: ["{deductible}"]

what_to_extract:
  deductible:
    description: |
      A list where each item represents a deductible entry and has:

        - deductible amount:
          - 'Must contain only deductible values such as ("$10,000", "$5,000", "10%", "5% subject to $1,000 minimum", "$250,000 each claim", "48 hours").'
          - 'Extract only values from the "Deductibles" column, NOT from the "Limits" column.'
          - 'If there are two deductible values on the same row, combine them into a single string separated by a comma.'
          - 'Do not extract values related to "{invalid_headers}", total payable, fees, or rates.'
          - 'Include time-based values (e.g., "48 hours") in the same field.'
          - 'In between headers and the "$" amounts you may find huge gap between "deductibles" and $ amount values — ignore [[section_top_end]] and [[section_bottom_start]] and extract vertically aligned deductible $ amount values from table rows.'


        - subdeductible and aggregate:
          - 'Extract labels associated with the deductible such as "{sublimits_and_aggregates}" etc., if present near the deductible amount.'
          - 'If multiple deductible values exist with different labels, extract each separately with its corresponding label.'
          - 'If no label is present, omit this field.'

        - coverage for deductible:
          - 'Extract the full coverage description from the same row (e.g., "{top_coverage}").'
          - 'For time-based values (e.g., "48 hours"), use "Waiting Period" as the coverage.'

        - line_of_business:
          - 'extract the line_of_business(lob) from the page.'

    rules:
      - 'Do not extract any values from the "{limits}" column.'
      - 'Only extract rows where the "Deductibles" column contains a valid numeric, percentage, or time-based value.'
      - 'Ignore rows with values such as "$", "Nil", "N/A", or empty cells.'
      - 'Skip rows containing "{invalid_headers}", "form number", "form no", "premium values" or similar.'
      - 'If a row has no valid deductible value, skip it entirely.'
      - 'If a key has no value, omit the key entirely (do not return null, "", or NA).'
      - 'If a value contains "NOT APPLICABLE", omit that entry entirely.'
      - '**CRITICAL: extract all time-based values ending with "hours", "hour". These must always be treated as deductible values.**'

output_fields: ["deductible amount", "subdeductible and aggregate", "coverage for deductible", "line_of_business"]