field: "deductible"

also_appears_as: ["{deductible}"] 

what_to_extract:
  deductible:
    description: |
      A list where each item has:

        - deductible amount:
          - 'Must contain only currency values related to policy deductible (examples: "$60,000", "20 hours", "$2,000,000 deductible", "$1,000,000").'
          - 'Don't extract the amount from these or under these "{invalid_headers}".'
          - 'Don't extract the amount from premium'.
          - 'extract only from under "Ded/Ret Amount" till "excess of" in between these two headers are valid deductibles.'
          - 'dont extract under "Excess of" because under these columns the deductible amount is not valid.'

        - coverage for deductible:
          - 'Associated description given by LIABILITY "{auto_coverage}" etc.'
          - 'Extract deductibles which are in description like (eg: "deductible") with amount and separated by this symbol";".'

        - line_of_business:
          - 'extract the line_of_business(lob) from the page.'        

    rules:
      - 'Produce two entries per row if both have valid deductible amounts (eg: Comp ded and Coll Ded).'
      - 'Skip rows containing "{invalid_headers}", "form number", "form no" or with no valid deductible amount.'
      - 'Do not leave "coverage for deductible" blank — always pull the description from the same row as the deductible.'
      - 'If a key has no value, omit the key entirely (do not return null or "").'
      - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'
      - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'
      - 'extract only from under "Ded/Ret Amount" till "excess of" in between these two headers are valid deductibles.'
      - 'dont extract under "Excess of" because under these columns the deductible amount is not valid.'


output_fields: ['deductible amount', 'coverage for deductible', 'line_of_business']
