field: "deductible"

also_appears_as: ["{deductible}", "Deductible"]

what_to_extract:
  deductible:
    description: |
      A list where each item has:

        - deductible amount:
          - 'Must contain only currency values related to policy deductible (examples: "$250", "$500", "$1,000", "$2,500").' "{extra_info}" 
          - 'Extract deductible values only from the Deductible column in the vehicle coverage tables.'
          - 'Don't extract the amount from these or under these "{invalid_headers}".'
          - 'Do not extract the amount from premium or limits.'
          - 'If Deductible shows "NONE", do not extract that row.'
          - 'Preserve currency formatting exactly as shown.'

        - coverage for deductible:
          - 'Associated description given by LIABILITY "{auto_coverage}" etc.'
          - 'Coverage is the row name under the Coverage column (examples: "Uninsured Motorists PD", "Comprehensive", "Collision").'
          - 'If multiple vehicles exist, include the Vehicle Number or Vehicle Description with the coverage.'
          - 'Format coverage like: "Vehicle 1 Comprehensive", "Vehicle 1 Collision", "Vehicle 2 Uninsured Motorists PD".'
          - 'Extract deductibles which are in description like (eg: "deductible") with amount and separated by this symbol";".'

        - line_of_business:
         - 'extract the line_of_business(lob) from the page.'        

    rules:
      - 'Only extract values from Deductible column.'
      - 'Do NOT extract values from Premium or "{limits}" columns.'
      - 'Skip rows containing "{invalid_headers}" or with no valid deductible amount.'
      - 'Skip rows where deductible is NONE or blank.'
      - 'Do not leave "coverage for deductible" blank — always pull the description from the same row as the deductible.'
      - 'If a key has no value, omit the key entirely (do not return null or "").'
      - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'

output_fields: ['deductible amount', 'coverage for deductible', 'line_of_business']