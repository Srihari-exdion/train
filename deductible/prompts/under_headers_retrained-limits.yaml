field: 'deductible'

also_appears_as: ["{deductible}"] 

what_to_extract:
  deductible:
    description: |
      A list where each item has:

      - deductible amount:
          - 'The deductible value (examples: "$500", "20 hours", "10%", "$250,000.00 each Claim").' "{extra_info}"
          - '**SPECIFICALLY EXTRACT all amounts under "Schedule of Retained Limits" or "Retained Limits", "Retained Amount" headers** — these are deductibles.'
          - 'Include "Waiting Period" values (e.g., "48hours") in the same field.' 
          - 'Ignore values that belong to "{invalid_coverage}" and "{invalid_headers}".'
          - 'Don't extract the amount from premium'.
          - 'Sometimes the retention will be mentioned as "Ret" and then "$" with amount.'
          
          

       - subdeductible and aggregate:
          - 'Extract the sub-deductible label (e.g., "{sublimits_and_aggregates}") found near the deductible amount.'
          - 'From headers like "Retained Limits" and "Schedule of Retained Limits", extract every amount with "$" under these tags.'


       - coverage for deductible:
            - 'Associated description given by LIABILITY "{coverage}" etc.'
            - 'For waiting periods, use "Waiting Period" as the coverage.'  
            - 'Extract the full description from the "Coverage" column that is on the same row as the deductible amount.'

       - line_of_business:
          - 'extract the line_of_business(lob) from the page.'
            
  rules: 
     - '**CRITICAL**: Retained Limits IS Deductible — extract ALL "Retained Limits", "Retained Amount" amounts into the deductible field, NOT the limits field.'
     - 'Skip rows containing "{invalid_headers}", "form number", "form no", "premium values" or with no valid deductible amount.'
     - 'Do not leave "coverage for deductible" blank — always pull the description from the same row as the deductible.'
     - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'
     - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'



output_fields: ["deductible amount", "subdeductible and aggregate", "coverage for deductible", "line_of_business"]
