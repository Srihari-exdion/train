field: 'deductible'

also_appears_as: ["{deductible}"] 

what_to_extract:
  deductible:
    description: |
      A list where each item has:

      - deductible amount:
          - 'The deductible value (examples: "$250","$100,000", "20 hours", **"1%"**, "$250,000 each Claim").' "{extra_info}"
          - 'Include "Waiting Period" values (e.g., "48hours", "24 hour") in the same coloumn.'
          - 'Ignore values that belong to "{invalid_coverage}" and "{invalid_headers}".'
          - 'Don't extract the amount from premium'.
         
      - subdeductible and aggregate:
        - 'Extract the sub-deductible label (eg: "{sublimits_and_aggregates}") found near the deductible amount.'

      - coverage for deductible:
          - 'Associated description given by "{coverage}" etc. 
          - 'extract evey $ amount under the "{deductible}" or deductibles tag.'
          - 'if there are multiple deductible amount with different coverage and descriptions, extract all of them.'

      - line_of_business:
         - 'extract the line_of_business(lob) from the page.'
         
  rules: 
     - '**CRITICAL: extract all time based values ending with "hours", "hour". These must always be treated as deductible values.**'
     - 'Skip rows containing "{invalid_headers}", "form number", "form no", "premium values" or with no valid deductible amount.'
     - 'Do not leave "coverage for deductible" blank — always pull the description from the same row as the deductible.'
     - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'
     - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'
  

     

output_fields: ['deductible amount','subdeductible and aggregate', 'coverage for deductible', 'line_of_business']
