field: "deductible"

also_appears_as: ["{deductible}"]

what_to_extract:
  deductible:
    description: |
      A list where each item represents a deductible entry and has:

        - deductible amount:
          - 'Must contain only currency values related to policy deductible (examples: "$500", **"10%"**, "$250,000.00 each Claim", "$100,000 or 2.00% any one OCCURRENCE").' "{extra_info}"
          - 'Include "Waiting Period" values (e.g., "48hours") in the same field. '
          - **'If there is any "IV. deductible" header under that information is belongs to that header only.'**
      

        - subdeductible and aggregate:
          - 'Extract the sub-deductible label (e.g., "{sublimits_and_aggregates}") found near the deductible amount.'
          - 'you will find like (eg: "A","B","C","D","E","F"and etc.....) under the deductible tag extract every amount having "$" under the deductible tag.'


        - coverage for deductible:
          - 'Extract the full description from the "Coverage" column that is on the same row as the deductible amount.'
          - 'For waiting periods, use "Waiting Period" as the coverage.'

        - line_of_business:
          - 'extract the line_of_business(lob) from the page.'

    rules:
      - 'Only extract data from rows that have a numerical deductible amount.'
      - 'Do not extract anything from rows that contain only a dollar sign ($) or no numerical value or NA.'
      - 'Skip rows containing "{invalid_headers}" or with no valid deductible amount.'
      - 'If a key has no value, omit the key entirely do not return ("null", "" , "NA").'
      - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'


output_fields: ["deductible amount", "subdeductible and aggregate", "coverage for deductible", "line_of_business"]        
