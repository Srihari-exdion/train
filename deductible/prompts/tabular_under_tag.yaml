field: 'deductible'

also_appears_as: ["{deductible}"] 

what_to_extract:
  deductible:
    description: |
      A list where each item has:

      - deductible amount:
          - 'The deductible value (examples: "$500", "20 hours", "10%", "$250,000.00 each Claim").' "{extra_info}"
          - 'Include "Waiting Period" values (eg: "48 hours") in the same field.' 
          - 'Ignore values that belong to "{invalid_coverage}".'
          - 'Don't extract the amount from premium'.
          - 'In between headers and the "$" amounts you may find paragraphs like (eg: "{paragraph_context_header}") ignore and extract vertical align "$" amounts values.'

          

       - subdeductible and aggregate:
          - 'Extract the sub-deductible label (eg: "{sublimits_and_aggregates}") found near the deductible amount.'
          - 'You will find a header on the top like (eg: "Retention", "RETENTIONS:") — extract every amount having "$" amount under the deductible headers.'


       - coverage for deductible:
            - 'Associated description given by "{top_coverage}" etc.'
            - 'For waiting periods, use "Waiting Period" as the coverage.'  
            - 'Extract the full description from the "Coverage" column that is on the same row as the deductible amount.'

      - line_of_business:
         - 'extract the line_of_business(lob) from the page.'
            
  rules: 
     - 'You will find a header on the top like (eg: "Retention", "RETENTIONS:", "deductibles") — under these headers the "$" amounts are belongs to deductibles.'
     - '**CRITICAL: Extract values when keywords appear: "{deductible}" these are deductibles**.'
     - 'Skip rows containing "premium", "form number", "form no", "premium values" or with no valid deductible amount.'
     - 'Do not leave "coverage for deductible" blank — always pull the description from the same row as the deductible.'
     - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'
     - 'Skip rows containing "{invalid_headers}", "form number", "form no" or with no valid deductible amount.'
     - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'



output_fields: ["deductible amount", "subdeductible and aggregate", "coverage for deductible", "line_of_business"]
