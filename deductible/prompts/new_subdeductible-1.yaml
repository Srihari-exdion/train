field: "deductible"

also_appears_as: ["{deductible}"]

what_to_extract:
  deductible:
    description: |
      A list where each item represents a deductible entry and has:

        - deductible amount:
          - 'Must contain only currency values or time periods related to policy deductible (examples: "$500", "20 hours", **"10%"**, "$250,000.00 each Claim").'
          - 'If there are two deductible values on the same row (e.g., "{sublimits_and_aggregates}"),combine them into a single string separated by a comma.'
          - 'Don't extract the amount from premium'.
          - 'Include "Waiting Period" values (e.g.,  "48hours") in the same field.'
          - 'you will find header on the top like (eg: "DEDUCTIBLES", "OCCURRENCE*") under these tags extract all those amount with "$" belongs to deductibles.'

        - subdeductible and aggregate:
          - 'Extract the sub-deductible label (e.g., "{sublimits_and_aggregates}") found near the deductible amount.'
          - 'If multiple deductible values exist on same row with different labels, extract each separately.'
          - 'If no sub-label exists, omit this key.'

        - coverage for deductible:
          - 'Extract the full description from the "{Coverage}" column or first column that is on the same row as the deductible amount.'
          - 'For waiting periods, extract the actual coverage description (e.g., "Waiting Period for Delay in Completion"), NOT just "Waiting Period".' 
          - 'you will find header on the top like (eg: "DEDUCTIBLES", "OCCURRENCE*") under these tags extract all those amount with "$" belongs to deductibles.'
          
        - line_of_business:
         - 'extract the line_of_business(lob) from the page.'

    rules:
      - 'Dont extract the deductible amount in limits.'
      - 'Only extract data from rows that have a numerical deductible amount.'
      - 'Do not extract anything from rows that contain only a dollar sign ($) or no numerical value or NA.'
      - 'Skip rows containing "{invalid_headers}", "form number", "form no", "premium values" or with no valid deductible amount.'
      - 'If a key has no value, omit the key entirely (do not return null or "" or NA).'
      - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'
      - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'

output_fields: ["deductible amount", "subdeductible and aggregate", "coverage for deductible", "line_of_business"]