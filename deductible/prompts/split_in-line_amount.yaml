field: "deductible"

also_appears_as: ["{deductible}"]

what_to_extract:
  deductible:
    description: |
      A list where each item represents a deductible entry and has:

        - deductible amount:
          - 'Must extract all deductible values present in the deductible sentence or section (examples: "$2,500", "$10,000", "10%").'
          - 'If multiple deductible amounts appear in a single sentence (e.g., base deductible + conditional deductible), extract each as a separate entry.'
          - 'Do not merge different deductible amounts into one string if they represent different conditions.'
          - 'Include values even if they are part of conditional phrases like "except", "subject to", or "for loss caused by".'
          - 'Do not extract "Premium" columns or unrelated financial values.'

        - coverage for deductible:
          - 'Extract the "{coverage}" name or section where the deductible is defined (e.g., property coverage, policy-level deductible).'
          - 'If no explicit coverage is mentioned, use a generic label such as "Property Coverage" or omit if unclear.'

        - line_of_business:
          - 'extract the line_of_business(lob) from the page.'

    rules:
      - 'Extract deductible values from free-text sentences, not just tables.'
      - 'If multiple deductible values are present in one sentence, always split them into separate entries.'
      - 'Do NOT combine base deductible and conditional deductible into one field.'
      - 'Ignore values related to limits, "{invalid_headers}", coinsurance, these are invalid deductible amount.'
      - 'Ignore related to "{invalid_coverage}" these are invalid deductible coverages.'
      - 'Skip rows or sections where no deductible value exists.'
      - 'If a key has no value, omit the key entirely (do not return null, "", or NA).'
      - 'If a value contains "NOT APPLICABLE", omit that entry entirely.'
      - '**CRITICAL: correctly associate each deductible with its condition (e.g., "$10,000" → "Theft").**'
      - '**CRITICAL: extract time-based values (hours) if present as deductibles.**'
      - 'dont extract which are containing "{limits}" values in row and columns because these are invalid deductible amount.'

output_fields: ["deductible amount",  "coverage for deductible", "line_of_business"]