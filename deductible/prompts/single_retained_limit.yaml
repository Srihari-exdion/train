field: "deductible"

also_appears_as: ["{deductible}"]

what_to_extract:
  deductible:
    description: |
      A list where each item represents a deductible entry and has:

        - deductible amount:
          - 'Must contain only currency values related to policy deductible (examples: "$500", "20 hours", **"10%"**, "$250,000.00").' "{extra_info}"
          - 'Don't extract the amount from premium'.
          - '**EXTRACT all amounts under standalone "Retained Limits" sections — these are deductible amounts**.'
          - 'Include the dollar symbol ($) exactly as shown.'

        - coverage for deductible:
          - 'Extract the full description from the "{Coverage}" column that is on the same row as the deductible amount.'
          - '**EXTRACT all amounts under "Retained Limits" tags — these are deductibles**.'

        - line_of_business:
         - 'extract the line_of_business(lob) from the page.'

    rules:
      - ' **CRITICAL: Extract ALL amounts from "Retained Limits" into the deductible field.**'
      - 'Only extract data from rows that have a numerical deductible amount.'
      - 'Do not extract anything from rows that contain only a dollar sign ($) or no numerical value or NA.'
      - 'Skip rows containing "{invalid_headers}", "form number", "form no", "premium values" or with no valid deductible amount.'
      - 'If a key has no value, omit the key entirely (do not return null or "" or NA).'
      - 'If a key has "NOT APPLICABLE" in the value omit the key entirely (do not return null or "").'
      - '**Extract data from rows that have a time period (e.g:"72 hours").**'


output_fields: ["deductible amount", "coverage for deductible", "line_of_business"]        
