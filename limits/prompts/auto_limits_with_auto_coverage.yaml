
field: 'limits'

also_appears_as: ["{limits}", "{Additional_schedule}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context only. Do not extract example text unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all instructions and constraints strictly based on the visible content. Do not infer or hallucinate missing data."

what_to_extract:
  limits:
    description: |
      A structured list where each entry represents a single limit value from a schedule table with the following fields:
        - limit amount:
          - 'Extract numeric or monetary values representing limits. These may or may not include currency symbols or codes (e.g., "$10,000", "25,000", "USD 500").'
          - 'Extract  or $ amounts found under ("{limits}", "{Additional_schedule}") these headers.'
          - 'Do not extract from these headers (e.g., "{invalid_headers}", "{deductible}").'
          - 'Do not extract values if the target limit cell is blank or empty.'

        - auto coverage for limits:
          - 'Extract the exact column header "{Additional_schedule}" for every separate $ amount.'
          - 'Do not extract from these headers (e.g., "{invalid_coverage}").'

        - auto description for limits:
          - 'Extract the "{header_vehicle_description}" primary description column that is horizontally aligned with the limit amount.'

        - line_of_business:
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'

    rules:
      - 'Extract limits on a row-by-row and column-by-column basis.'
      - 'If a single row contains multiple valid limit columns, create a separate entry in the list for each limit column.'
      - 'Strictly ignore all columns, headers, or cells designated for premium, cost, surcharge, or fee amounts.'
      - 'Do not leave "auto coverage for limits" or "auto description for limits" blank for any extracted limit amount.'
      - 'Preserve exact character casing, spacing, numbers, punctuation, and currency symbols as rendered in the document.'
      - 'If a key or field has no visible value in a row, omit the key or record entirely.'

output_fields: ['limit amount', 'auto coverage for limits', 'auto description for limits', 'line_of_business']