
field: "limits"

also_appears_as: ["{alternate_limits}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item has:

        - "limit cost new amount":
          - 'Extract only the numerical value immediately following the "COST NEW:" label. (e.g., in "COST NEW: 96405", extract "96405"). "{extra_info}"'
          - 'Only extract the limit amoount near "Cost New"'
          - 'Ignore values that belong to "{invalid_coverage}".'
          - 'Do not extract the limit amount from "Premiums" or "Premium" column'
          - 'If header is "Premium", "Premiums", or "Deductible" do not extract that amount'
          - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'

        - "vehicle identification for limits":
          - 'Associated description given by "{vin_coverage}"'
          - 'Extract the "{alternate_limits}" associated with the specific vehicle where "{vin_coverage}" is found.'
          - 'Examples: "VIN: 123ABC8576888", "ID NO 4DRBUAFN67B123456" etc.'
          - 'Add VEHICLE IDENTIFICATION NUMBER (VIN) as description.'
          - 'Do not extract the limit amount from "Premiums" or "Premium" column'

        - line_of_business:
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'

    rules:
      - 'Extract single line limits as well which are not in tabular format'
      - 'Skip entries where "{deductible}" is mentioned.'
      - 'Skip rows containing "{invalid_headers}" or with no valid limit amount.'
      - 'For "cost new" entries, use "COST NEW" or the Vehicle Number as the description if no other coverage label is on the same line.'
      - 'Preserve formatting exactly as shown in the source (e.g., "$60,000 Origin Cost New", "VIN 123ABC8576888", "COST NEW: 10100").'
      - 'If a key has no value, omit the key entirely (do not return null or "").'


output_fields: ['limit cost new amount', 'vehicle identification for limits', 'line_of_business']

