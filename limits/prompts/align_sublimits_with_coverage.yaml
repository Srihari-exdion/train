field: 'limits'

also_appears_as: ["{limits}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item represents a single row of coverage and has:

        - limit amount:
          - 'Extract values related to policy limits of liability. These may or may not contain a currency symbol like "$" or "USD". (examples: "$60,100", "$2,010,000 Aggregate", "$1,010,000 Each Occurrence"). "{extra_info}"'
          - 'Ignore values that belong to "{invalid_coverage}".'
          - 'Combine all valid currency limits from the "{sublimits_and_aggregates}" columns on the same line into a single comma-separated string.'
          - 'Must contain only currency values **with the dollar symbol ($) included exactly as shown in the document**'
          - 'Do not extract the amount from premium'

        - sublimits and aggregate:
            - '(example: "each claim", "aggregate")'
            - 'Extract the row-specific sublimit modifier or aggregate text only if explicitly stated for that specific row.'
            - 'If same amount repeated, extract each separately with respective "{sublimits_and_aggregates}" limit'
            - 'Do not extract general column headers (like "Per Occurrence") unless they are uniquely specified as a sublimit modifier for that line.'
            - 'If no distinct row-level "{sublimits_and_aggregates}" label is present, omit this key.'

        - coverage for limits:
            - 'Associated description given by LIABILITY "{coverage}" etc.'
            - 'This value is the description from the first column of the row.'
          
        - line_of_business:
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'

    rules:
      - 'If "{sublimits_and_aggregates}" have separate amount then, extract them separately as separate limits'
      - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'
      - 'Extract single line limits as well which are not in tabular format'
      - 'Skip entries where "deductible", "retention", "coverage retention", "insured entity retention", or "waiting period" is mentioned in row or column.'
      - 'Skip rows and columns containing "premium", "form number", "form no", "premium values" or with no valid limit amount.'
      - 'Do not leave "coverage for limits" blank — always pull the description from the same row as the limit.'
      - 'Preserve formatting exactly as shown in the source'
      - 'If a key has no value, omit the key entirely (do not return null or "").'

output_fields: ['limit amount','sublimits and aggregate','coverage for limits', 'line_of_business']
