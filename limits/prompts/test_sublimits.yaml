field: 'limits'

also_appears_as: ["{limits}", "Attachment", "Stated Limit", "Stated Limit or ACV", "ACV", "Actual Cash Value"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item has:

        - limit amount:
            - 'Extract values related to policy limits of liability, limits of insurance, or insured values.'
            - 'Also extract values appearing under columns or headers such as "Stated Limit", "Stated Limit or ACV", "ACV", or "Actual Cash Value". Treat these as valid limits for the associated vehicle or property.'
            - 'Extract values even if they do not contain a currency symbol like "$" or "USD". (examples: "$60,100", "2,010,000", "24,205").'
            - 'If multiple valid limits appear in the same row, combine them into a single string, comma-separated.'
            - 'Preserve the currency symbol if it exists in the document. Do not add or remove "$".'
            - 'Ignore values that belong to "{invalid_coverage}".'
            - 'Strictly ignore values belonging to: "{invalid_coverage}" or headers like: "{invalid_headers}".'
            - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'
            
        - coverage for limits:
            - 'Extract the coverage description associated with the limit.'
            - 'If the limit appears under "Stated Limit", "Stated Limit or ACV", "ACV", or "Actual Cash Value", use that header as the coverage.'
            - 'For scheduled vehicle tables, associate each limit with its corresponding vehicle row.'
            - 'Do not extract coverage if "{invalid_coverage}" is mentioned.'
            - 'Strictly ignore values belonging to: "{invalid_coverage}" or headers like: "{invalid_headers}".'
            - 'Do not extract "line of business" in this field.'

        - line_of_business:
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'

    rules:
      - 'Extract single-line limits as well as limits appearing in tables.'
      - 'Treat values under "Stated Limit", "Stated Limit or ACV", "ACV", or "Actual Cash Value" as valid limits, not premiums.'
      - 'Determine whether a numeric value is a limit based on its column header, not its position near premium columns.'
      - 'Skip entries where "forms" or "{deductible}" is mentioned.'
      - 'Skip rows containing "{invalid_headers}" or with no valid limit amount.'
      - 'Do not leave "coverage for limits" blank — always pull the description from the same row or the corresponding column header.'
      - 'Preserve formatting exactly as shown in the source.'
      - 'If a key has no value, omit the key entirely (do not return null or "").'
      - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible", "comp Ded", "Coll Ded" dont extract because those are invalid limits.'


output_fields: ['limit amount', 'coverage for limits', 'line_of_business']