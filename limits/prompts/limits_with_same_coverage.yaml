field: 'limits'
also_appears_as: ["{limits}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item represents a single row of coverage and has:
        - limit amount:
            - 'Extract values related to policy limits of liability. These may or may not contain a currency symbol like "$" or "USD". "{extra_info}"'
            - 'If multiple valid limits appear in the same row, combine them into a single string, comma-separated.'
            - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'
            
        - coverage for limits:
            - 'Extract the full description of the liability coverage (e.g., "{coverage}").'
            - 'To prevent duplicates: If multiple rows have the same coverage name and limit value, you MUST prefix or suffix the description with any identifying information found in the same row (e.g., State, Location #, Item #, or specific sub-category like "MEDPAY" or "UM").'
            - 'Example: "Excess Liability (WI - MEDPAY)", "Excess Liability (Location 1)".'

        - line_of_business:
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'
            
    rules:
      - 'Row-by-Row Extraction: Never merge rows that appear separately in the document, even if the data looks identical.'
      - 'Identifier Search: Always check the leading columns (e.g., State, No., Loc) for unique identifiers to include in the "coverage for limits" field.'
      - 'Skip entries where "{deductible}" is mentioned.'
      - 'Skip rows containing "{invalid_headers}" or with no valid limit amount.'
      - 'Do not leave "coverage for limits" blank — always pull the description and any row-specific identifiers from the same horizontal line.'
      - 'Preserve formatting exactly as shown in the source.'
      - 'If a key has no value, omit the key entirely.'

output_fields: ['limit amount','coverage for limits', 'line_of_business']