field: 'limits'

also_appears_as: ["{alternate_limits}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item has:
        - "stated amount":
          - 'Extract values related to policy limits of liability. These may or may not contain a currency symbol like "$" or "USD". (examples: "Stated Value 24,205", "$2,010,000 Actual Cash Value", "27,645" "{alternate_limits}"). "{extra_info}"'
          - 'Extract from the header, "{stated_limit}"'
          - 'Ignore the premium value (e.g., "6,298") located directly above the stated limit.'
          - 'Ignore values ending in "Ded" or "Incl".'
          - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'
        - "auto coverage for limits":
          - 'Extract the "VIN" from the top row of the same vehicle block where the stated amount was found.'
          - 'Format: Use the label "Stated Limit or ACV with VIN [VIN NUMBER]".'
          - 'Example: "Stated Limit or ACV with VIN 1FDWE35L53HA63337".'
          - 'Associated description given by LIABILITY "{auto_coverage}", "VIN" etc.'\
        - "line_of_business":
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'

    rules:
      - 'Identify vehicle blocks: Each block contains 3 rows of data for one vehicle.'
      - 'Row 1 anchor: Contains the VIN (e.g., 1FDWE...).'
      - 'Row 3 anchor: Contains the Stated Limit "{stated_limit}" (e.g., 24,205).'
      - 'Skip rows containing "Premium", "Deductible", "Ded" or "Total".'
      - 'If a key has no value, omit the key entirely.'

output_fields: ['stated amount', 'auto coverage for limits', 'line_of_business']