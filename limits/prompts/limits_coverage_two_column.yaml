field: 'limits'

also_appears_as: ["{limits}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item has:
        - limit amount:
            - 'Extract values related to policy limits of liability. These may or may not contain a currency symbol like "$" or "USD". (examples: "$60,100", "$2,010,000 Aggregate", "$1,010,000 Each Occurrence"). "{extra_info}"'
            - 'Ignore values that belong to "{invalid_coverage}".'
            - 'Must contain only currency values **with the dollar symbol ($) included exactly as shown in the document**.'
            - 'Entries are available in two columns, extract all the rows from both the columns'
            - 'Extract the whole row, example ("Debris Removal Expense - 25 of loss up to an additional $50,000 Accounts Receivable $100,000)'
            - 'Do not extract the amount from premium'
            - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'

        - coverage for limits:
            - 'Associated description given by LIABILITY "{coverage}" etc.'
            - 'Entries are available in two columns, extract all the rows from both the columns'
            - 'Extract the whole row, example ("Debris Removal Expense - 25 of loss up to an additional $50,000 Accounts Receivable $100,000)'            
            - 'Do not extract coverage if "{invalid_coverage}" is mention'

        - line_of_business:
          - 'Extract the line of business (LOB) for each row.'
          - 'Identify the Line of Business (LOB) for the each row from the referred LOB below.'

    rules:
      - 'Do the detailed extraction of entries available in two columns, extract from both the columns'
      - 'Focus on alignment of coverage and limit amount and extract properly'
      - 'Extract single line limits as well which are not in tabular format'
      - 'Skip entries where "{deductible}" is mentioned.'
      - 'Skip rows containing "{invalid_headers}" or with no valid limit amount.'

output_fields: ['limit amount','coverage for limits', 'line_of_business']
